<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAI15I6Sdl4pIkjOnK3UHx6QAaA_Nhs2pA",
  authDomain: "organizador-clases-de-padel.firebaseapp.com",
  projectId: "organizador-clases-de-padel",
  storageBucket: "organizador-clases-de-padel.firebasestorage.app",
  messagingSenderId: "949517364408",
  appId: "1:949517364408:web:5b6d40f02c61f8cddb184d"
};

const TELEFONO_PROFE = "5491165793553";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.__firebase = { db, doc, getDoc, setDoc, onSnapshot, TELEFONO_PROFE };
window.__firebaseReady = true;
window.dispatchEvent(new Event("firebase-ready"));
</script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

const HORAS = ["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00"];
const DIAS_LABEL = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DIAS_NOMBRE = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];
const CUPO_GRUPAL = 4;
const LINK_APP_ALUMNO = "https://organizador-clases-padel.vercel.app";

const IconCheck = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
);
const IconX = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
);
const IconBell = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
);
const IconUsers = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
);
const IconTrash = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
);
const IconChevronLeft = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
);
const IconChevronRight = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
);
const IconWhatsapp = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.552 4.223 1.6 6.062L0 24l6.13-1.594A11.95 11.95 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a9.9 9.9 0 0 1-5.05-1.379l-.362-.215-3.744.974.999-3.648-.236-.374A9.94 9.94 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
);

function normalizarTelefono(t) { return (t || "").replace(/[^\d]/g, ""); }
function armarLinkWhatsapp(telefono, mensaje) {
  return `https://wa.me/${normalizarTelefono(telefono)}?text=${encodeURIComponent(mensaje)}`;
}

function plantillaVacia() {
  const t = {};
  for (let di = 0; di < 7; di++) {
    HORAS.forEach((h) => {
      t[`${di}_${h}`] = { estado: (di === 5 || di === 6) ? "no_disponible" : "disponible" };
    });
  }
  return t;
}

function useFirebase() {
  const [listo, setListo] = useState(!!window.__firebaseReady);
  useEffect(() => {
    if (listo) return;
    const handler = () => setListo(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, [listo]);
  return listo ? window.__firebase : null;
}

// ---------------------------------------------------------------------------
// LOGIN
// ---------------------------------------------------------------------------
function LoginTelefono({ onIngresar }) {
  const [telefono, setTelefono] = useState("");
  const [error, setError] = useState("");

  const ingresar = () => {
    const tel = normalizarTelefono(telefono);
    if (tel.length < 8) { setError("Ingresá un teléfono válido con código de país"); return; }
    onIngresar(tel);
  };

  return (
    <div className="min-h-screen bg-[#141D18] text-[#EEEAE0] font-sans flex items-center justify-center px-5 relative overflow-hidden">
      <div className="pointer-events-none absolute inset-0 opacity-[0.04]" style={{ backgroundImage: "repeating-linear-gradient(0deg, transparent, transparent 78px, #F3F0E8 78px, #F3F0E8 80px), repeating-linear-gradient(90deg, transparent, transparent 78px, #F3F0E8 78px, #F3F0E8 80px)" }} />
      <div className="w-full max-w-xs relative">
        <p className="text-[10px] uppercase tracking-[0.2em] text-[#8FAE95] font-semibold mb-1 text-center">Clases de pádel</p>
        <h1 className="text-2xl font-black text-center text-[#F3F0E8] mb-6">Ingresá tu teléfono</h1>
        <input value={telefono} onChange={(e) => { setTelefono(e.target.value); setError(""); }} placeholder="Ej: 5491122334455" inputMode="tel" className="w-full mb-2 px-4 py-3 rounded-xl bg-[#1D2921] border border-[#3A4A3F] text-base text-[#EEEAE0] placeholder:text-[#5C6660] outline-none focus:border-[#8FAE95] text-center" />
        {error && <p className="text-[#C24B4B] text-xs text-center mb-2">{error}</p>}
        <p className="text-[10px] text-[#5C6660] text-center mb-5">Con código de país, sin espacios ni guiones.</p>
        <button onClick={ingresar} className="w-full py-3 rounded-xl bg-[#C9E4B5] text-[#142016] text-sm font-bold hover:brightness-95 active:scale-[0.98] transition">Entrar</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// RAÍZ
// ---------------------------------------------------------------------------
function AppRaiz() {
  const fb = useFirebase();
  const [telefono, setTelefono] = useState(() => localStorage.getItem("padel_telefono") || null);

  const ingresar = (tel) => { localStorage.setItem("padel_telefono", tel); setTelefono(tel); };
  const salir = () => { localStorage.removeItem("padel_telefono"); setTelefono(null); };

  if (!fb) {
    return <div className="min-h-screen bg-[#141D18] flex items-center justify-center text-[#8FA090] text-sm">Cargando...</div>;
  }
  if (!telefono) return <LoginTelefono onIngresar={ingresar} />;

  const esProfe = telefono === fb.TELEFONO_PROFE;
  return esProfe ? <PanelProfe fb={fb} onSalir={salir} /> : <CalendarioAlumno fb={fb} telefono={telefono} onSalir={salir} />;
}

// ---------------------------------------------------------------------------
// PANEL DEL PROFE
// ---------------------------------------------------------------------------
function PanelProfe({ fb, onSalir }) {
  const [vista, setVista] = useState("plantilla");
  const [plantilla, setPlantilla] = useState(null);
  const [semanaPub, setSemanaPub] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [herramienta, setHerramienta] = useState("disponible");
  const [seleccion, setSeleccion] = useState(new Set());
  const [toast, setToast] = useState(null);
  const [pidiendoDatos, setPidiendoDatos] = useState(null);
  const [formNombre, setFormNombre] = useState("");
  const [formTelefono, setFormTelefono] = useState("");
  const [editandoGrupal, setEditandoGrupal] = useState(null);

  const mostrarToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  // Suscripción en tiempo real a la plantilla
  useEffect(() => {
    const refPlantilla = fb.doc(fb.db, "plantilla", "semana");
    const unsub = fb.onSnapshot(refPlantilla, async (snap) => {
      if (snap.exists()) {
        setPlantilla(snap.data());
      } else {
        const vacia = plantillaVacia();
        await fb.setDoc(refPlantilla, vacia);
        setPlantilla(vacia);
      }
      setCargando(false);
    });
    return () => unsub();
  }, []);

  // Suscripción a la semana publicada
  useEffect(() => {
    const refPub = fb.doc(fb.db, "semanaPublicada", "actual");
    const unsub = fb.onSnapshot(refPub, (snap) => {
      setSemanaPub(snap.exists() ? snap.data() : { aprobada: false, avisosEnviados: [] });
    });
    return () => unsub();
  }, []);

  const guardarPlantilla = async (nuevaPlantilla) => {
    const refPlantilla = fb.doc(fb.db, "plantilla", "semana");
    await fb.setDoc(refPlantilla, nuevaPlantilla);
  };

  const toggleCelda = (di, h) => {
    const key = `${di}_${h}`;
    setSeleccion((prev) => {
      const copia = new Set(prev);
      if (copia.has(key)) copia.delete(key); else copia.add(key);
      return copia;
    });
  };

  const aplicarHerramienta = async () => {
    if (seleccion.size === 0) return;
    if (herramienta === "no_disponible") {
      setPidiendoDatos({ keys: Array.from(seleccion) });
      setFormNombre(""); setFormTelefono("");
      return;
    }
    const copia = { ...plantilla };
    seleccion.forEach((key) => {
      copia[key] = herramienta === "grupal" ? { estado: "grupal", alumnos: [] } : { estado: herramienta };
    });
    await guardarPlantilla(copia);
    mostrarToast(`${seleccion.size} horario${seleccion.size > 1 ? "s" : ""} actualizado${seleccion.size > 1 ? "s" : ""}`);
    setSeleccion(new Set());
  };

  const confirmarDatosAlumno = async () => {
    if (!pidiendoDatos) return;
    const copia = { ...plantilla };
    pidiendoDatos.keys.forEach((key) => {
      copia[key] = { estado: "no_disponible", alumno: formNombre.trim() || null, telefono: formTelefono.trim() || null };
    });
    await guardarPlantilla(copia);
    mostrarToast(`${pidiendoDatos.keys.length} horario${pidiendoDatos.keys.length > 1 ? "s" : ""} asignado${pidiendoDatos.keys.length > 1 ? "s" : ""}`);
    setPidiendoDatos(null);
    setSeleccion(new Set());
  };

  const agregarAlumnoGrupal = async (di, h, nombre, telefono) => {
    const key = `${di}_${h}`;
    const copia = { ...plantilla };
    const turno = { ...copia[key] };
    const alumnos = [...(turno.alumnos || [])];
    if (alumnos.length >= CUPO_GRUPAL) return;
    alumnos.push({ nombre: nombre.trim(), telefono: telefono.trim() || null });
    copia[key] = { ...turno, alumnos };
    await guardarPlantilla(copia);
  };

  const quitarAlumnoGrupal = async (di, h, idx) => {
    const key = `${di}_${h}`;
    const copia = { ...plantilla };
    const turno = { ...copia[key] };
    const alumnos = [...(turno.alumnos || [])];
    alumnos.splice(idx, 1);
    copia[key] = { ...turno, alumnos };
    await guardarPlantilla(copia);
  };

  const aprobarSemana = async () => {
    const refPub = fb.doc(fb.db, "semanaPublicada", "actual");
    await fb.setDoc(refPub, { aprobada: true, datos: plantilla, avisosEnviados: semanaPub?.avisosEnviados || [] });
    mostrarToast("Semana aprobada y publicada para tus alumnos");
  };

  const marcarAvisoEnviado = async (key) => {
    const refPub = fb.doc(fb.db, "semanaPublicada", "actual");
    const nuevos = [...(semanaPub?.avisosEnviados || []), key];
    await fb.setDoc(refPub, { ...semanaPub, avisosEnviados: nuevos });
  };

  if (cargando || !plantilla) {
    return <div className="min-h-screen bg-[#141D18] flex items-center justify-center text-[#8FA090] text-sm">Cargando disponibilidad...</div>;
  }

  return (
    <div className="min-h-screen bg-[#141D18] text-[#EEEAE0] font-sans relative overflow-hidden">
      <div className="pointer-events-none absolute inset-0 opacity-[0.04]" style={{ backgroundImage: "repeating-linear-gradient(0deg, transparent, transparent 78px, #F3F0E8 78px, #F3F0E8 80px), repeating-linear-gradient(90deg, transparent, transparent 78px, #F3F0E8 78px, #F3F0E8 80px)" }} />
      <div className="max-w-5xl mx-auto px-3 sm:px-4 py-3 sm:py-6 relative">
        <div className="flex items-center justify-between mb-3">
          <div>
            <p className="text-[9px] sm:text-[10px] uppercase tracking-[0.2em] text-[#8FAE95] font-semibold">Panel del profe</p>
            <h1 className="text-lg sm:text-2xl font-black tracking-tight text-[#F3F0E8]">Disponibilidad</h1>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex items-center gap-1 bg-[#1D2921] rounded-full p-1 border border-[#2E3D33] text-[11px] sm:text-xs font-semibold">
              <button onClick={() => setVista("plantilla")} className={`px-3 py-1.5 rounded-full transition ${vista === "plantilla" ? "bg-[#EEEAE0] text-[#142016]" : "text-[#C7D6CA]"}`}>Plantilla</button>
              <button onClick={() => setVista("revision")} className={`px-3 py-1.5 rounded-full transition relative ${vista === "revision" ? "bg-[#EEEAE0] text-[#142016]" : "text-[#C7D6CA]"}`}>
                Domingo
                {!semanaPub?.aprobada && <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-[#D6A419]" />}
              </button>
            </div>
            <button onClick={onSalir} className="text-[10px] text-[#5C6660] underline">Salir</button>
          </div>
        </div>

        <div className="h-px bg-gradient-to-r from-transparent via-[#8FAE95]/40 to-transparent mb-4" />

        {vista === "plantilla" ? (
          <PlantillaEditor
            plantilla={plantilla}
            seleccion={seleccion}
            toggleCelda={toggleCelda}
            herramienta={herramienta}
            setHerramienta={setHerramienta}
            aplicarHerramienta={aplicarHerramienta}
            limpiarSeleccion={() => setSeleccion(new Set())}
            onAbrirGrupal={(di, h) => setEditandoGrupal({ di, h })}
          />
        ) : (
          <RevisionDomingo
            plantilla={plantilla}
            semanaPub={semanaPub}
            onAvisar={marcarAvisoEnviado}
            onAprobar={aprobarSemana}
          />
        )}
      </div>

      {pidiendoDatos && (
        <div className="fixed inset-0 bg-[#0A0F0C]/70 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 px-4" onClick={() => setPidiendoDatos(null)}>
          <div className="bg-[#1B2620] border border-[#3A4A3F] rounded-2xl p-5 w-full sm:max-w-sm mb-4 sm:mb-0 shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <p className="text-[10px] uppercase tracking-[0.2em] text-[#8FAE95] font-semibold mb-1">{pidiendoDatos.keys.length} horario{pidiendoDatos.keys.length > 1 ? "s" : ""} · No disponible</p>
            <h2 className="text-base font-bold text-[#F3F0E8] mb-4">¿A qué alumno le asignás esta clase?</h2>
            <label className="block text-[11px] text-[#8FA090] mb-1">Nombre (opcional)</label>
            <input value={formNombre} onChange={(e) => setFormNombre(e.target.value)} placeholder="Ej: Marcos Díaz" className="w-full mb-3 px-3 py-2 rounded-lg bg-[#141D18] border border-[#3A4A3F] text-sm text-[#EEEAE0] placeholder:text-[#5C6660] outline-none focus:border-[#8FAE95]" />
            <label className="block text-[11px] text-[#8FA090] mb-1">Teléfono de WhatsApp (opcional)</label>
            <input value={formTelefono} onChange={(e) => setFormTelefono(e.target.value)} placeholder="Ej: 11 2233 4455" inputMode="tel" className="w-full mb-1 px-3 py-2 rounded-lg bg-[#141D18] border border-[#3A4A3F] text-sm text-[#EEEAE0] placeholder:text-[#5C6660] outline-none focus:border-[#8FAE95]" />
            <p className="text-[10px] text-[#5C6660] mb-4">Con el código de país, sin espacios ni guiones.</p>
            <div className="flex gap-2">
              <button onClick={() => setPidiendoDatos(null)} className="flex-1 py-2.5 rounded-xl border border-[#3A4A3F] text-sm text-[#C7D6CA] hover:bg-[#232E27] transition">Cancelar</button>
              <button onClick={confirmarDatosAlumno} className="flex-1 py-2.5 rounded-xl bg-[#C9E4B5] text-[#142016] text-sm font-bold hover:brightness-95 active:scale-[0.98] transition">Guardar</button>
            </div>
          </div>
        </div>
      )}

      {editandoGrupal && (
        <EditorGrupalModal
          di={editandoGrupal.di} h={editandoGrupal.h}
          turno={plantilla[`${editandoGrupal.di}_${editandoGrupal.h}`]}
          onAgregar={agregarAlumnoGrupal}
          onQuitar={quitarAlumnoGrupal}
          onCerrar={() => setEditandoGrupal(null)}
        />
      )}

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full text-sm font-medium shadow-lg z-50 border bg-[#3F9142] text-[#EAFBEA] border-[#3F9142]">{toast}</div>}
    </div>
  );
}

const ESTILOS = {
  disponible:    { bg: "bg-[#2A5CA8]", text: "text-[#EAF1FF]" },
  no_disponible: { bg: "bg-[#3A3F45]", text: "text-[#8A9099]" },
  grupal:        { bg: "bg-[#2BB3B3]", text: "text-[#04211F]" },
};
const HERRAMIENTAS = [
  { id: "disponible", label: "Disponible", swatch: "bg-[#2A5CA8]" },
  { id: "no_disponible", label: "No disponible", swatch: "bg-[#3A3F45]" },
  { id: "grupal", label: "Grupal", swatch: "bg-[#2BB3B3]" },
];

function EditorGrupalModal({ di, h, turno, onAgregar, onQuitar, onCerrar }) {
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const alumnos = turno?.alumnos || [];
  const lleno = alumnos.length >= CUPO_GRUPAL;

  const agregar = () => {
    if (!nombre.trim() || lleno) return;
    onAgregar(di, h, nombre, telefono);
    setNombre(""); setTelefono("");
  };

  return (
    <div className="fixed inset-0 bg-[#0A0F0C]/70 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 px-4" onClick={onCerrar}>
      <div className="bg-[#1B2620] border border-[#3A4A3F] rounded-2xl p-5 w-full sm:max-w-sm mb-4 sm:mb-0 shadow-2xl max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <p className="text-[10px] uppercase tracking-[0.2em] text-[#2BB3B3] font-semibold mb-1 capitalize">{DIAS_NOMBRE[di]} · {h} hs</p>
        <h2 className="text-base font-bold text-[#F3F0E8] mb-1">Alumnos de la clase grupal</h2>
        <p className="text-xs text-[#8FA090] mb-4">{alumnos.length} de {CUPO_GRUPAL} lugares ocupados</p>
        {alumnos.length > 0 && (
          <div className="flex flex-col gap-1.5 mb-4">
            {alumnos.map((al, idx) => (
              <div key={idx} className="flex items-center justify-between gap-2 bg-[#141D18] border border-[#3A4A3F] rounded-lg px-3 py-2">
                <div><p className="text-sm font-semibold text-[#EEEAE0]">{al.nombre}</p>{al.telefono && <p className="text-[10px] text-[#8FA090]">{al.telefono}</p>}</div>
                <button onClick={() => onQuitar(di, h, idx)} className="text-[#C24B4B] p-1 active:scale-90 transition"><IconTrash /></button>
              </div>
            ))}
          </div>
        )}
        {!lleno ? (
          <div className="border-t border-[#2E3D33] pt-3">
            <label className="block text-[11px] text-[#8FA090] mb-1">Nombre del alumno</label>
            <input value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Ej: Vale Suárez" className="w-full mb-3 px-3 py-2 rounded-lg bg-[#141D18] border border-[#3A4A3F] text-sm text-[#EEEAE0] placeholder:text-[#5C6660] outline-none focus:border-[#8FAE95]" />
            <label className="block text-[11px] text-[#8FA090] mb-1">Teléfono de WhatsApp (opcional)</label>
            <input value={telefono} onChange={(e) => setTelefono(e.target.value)} placeholder="Ej: 5491122334455" inputMode="tel" className="w-full mb-3 px-3 py-2 rounded-lg bg-[#141D18] border border-[#3A4A3F] text-sm text-[#EEEAE0] placeholder:text-[#5C6660] outline-none focus:border-[#8FAE95]" />
            <button onClick={agregar} disabled={!nombre.trim()} className="w-full py-2.5 rounded-xl bg-[#2BB3B3] text-[#04211F] text-sm font-bold disabled:opacity-40 hover:brightness-95 active:scale-[0.98] transition">Agregar alumno</button>
          </div>
        ) : (
          <p className="text-xs text-[#D6A419] bg-[#D6A419]/10 border border-[#D6A419]/30 rounded-lg px-3 py-2 text-center">Clase completa · {CUPO_GRUPAL} de {CUPO_GRUPAL}</p>
        )}
        <button onClick={onCerrar} className="w-full mt-3 py-2.5 rounded-xl border border-[#3A4A3F] text-sm text-[#C7D6CA] hover:bg-[#232E27] transition">Listo</button>
      </div>
    </div>
  );
}

function PlantillaEditor({ plantilla, seleccion, toggleCelda, herramienta, setHerramienta, aplicarHerramienta, limpiarSeleccion, onAbrirGrupal }) {
  return (
    <div>
      <p className="text-xs sm:text-sm text-[#8FA090] mb-3 leading-relaxed">
        Esta es tu disponibilidad de siempre. Tocá los horarios, elegí un estado y aplicalo. Un turno "Grupal" ya creado: tocalo para cargar hasta {CUPO_GRUPAL} alumnos.
      </p>
      <div className="overflow-x-auto -mx-3 px-3 pb-2">
        <div className="min-w-[560px] grid grid-cols-7 gap-1.5">
          {DIAS_LABEL.map((label, di) => (
            <div key={di} className="flex flex-col">
              <div className="text-center pb-1.5 mb-1.5 border-b-2 border-[#2E3D33]"><span className="text-[10px] sm:text-xs font-bold text-[#C7D6CA]">{label}</span></div>
              <div className="flex flex-col gap-1">
                {HORAS.map((h) => {
                  const turno = plantilla[`${di}_${h}`] || { estado: "disponible" };
                  const s = ESTILOS[turno.estado];
                  const key = `${di}_${h}`;
                  const seleccionado = seleccion.has(key);
                  const cant = turno.estado === "grupal" ? (turno.alumnos || []).length : 0;
                  return (
                    <button key={h} onClick={() => { if (turno.estado === "grupal" && seleccion.size === 0) onAbrirGrupal(di, h); else toggleCelda(di, h); }}
                      className={`relative rounded-md text-[9px] sm:text-[10px] font-bold py-1.5 transition active:scale-95 ${s.bg} ${s.text} ${seleccionado ? "ring-2 ring-offset-1 ring-offset-[#141D18] ring-[#EEEAE0]" : ""}`}>
                      {h}
                      {turno.alumno && <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full bg-[#EEEAE0]" />}
                      {turno.estado === "grupal" && <span className="block text-[8px] font-semibold opacity-80 -mt-0.5">{cant}/{CUPO_GRUPAL}</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="mt-4 pt-3 border-t border-[#2E3D33]">
        <p className="text-[10px] sm:text-xs text-[#8FA090] mb-2">{seleccion.size > 0 ? `${seleccion.size} horario${seleccion.size > 1 ? "s" : ""} seleccionado${seleccion.size > 1 ? "s" : ""}` : "Seleccioná horarios en la grilla"}</p>
        <div className="flex flex-wrap items-center gap-2">
          {HERRAMIENTAS.map((op) => (
            <button key={op.id} onClick={() => setHerramienta(op.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold border transition ${herramienta === op.id ? "border-[#EEEAE0] bg-[#1D2921]" : "border-[#2E3D33] text-[#8FA090]"}`}>
              <span className={`w-2.5 h-2.5 rounded-full ${op.swatch}`} />{op.label}
            </button>
          ))}
          <div className="flex-1" />
          <button onClick={limpiarSeleccion} disabled={seleccion.size === 0} className="px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold text-[#8FA090] disabled:opacity-40">Limpiar</button>
          <button onClick={aplicarHerramienta} disabled={seleccion.size === 0} className="px-4 py-1.5 rounded-full text-[11px] sm:text-xs font-bold bg-[#C9E4B5] text-[#142016] disabled:opacity-40 disabled:pointer-events-none hover:brightness-95 active:scale-[0.98] transition">Aplicar a la selección</button>
        </div>
      </div>
    </div>
  );
}

function RevisionDomingo({ plantilla, semanaPub, onAvisar, onAprobar }) {
  const aprobada = semanaPub?.aprobada;
  const avisosEnviados = new Set(semanaPub?.avisosEnviados || []);

  const totalDisponibles = useMemo(() => {
    let count = 0;
    Object.values(plantilla).forEach((t) => { if (t.estado === "disponible" || t.estado === "grupal") count++; });
    return count;
  }, [plantilla]);

  const todosParaAvisar = useMemo(() => {
    const lista = [];
    for (let di = 0; di < 7; di++) {
      HORAS.forEach((h) => {
        const key = `${di}_${h}`;
        const turno = plantilla[key];
        if (!turno) return;
        if (turno.estado === "no_disponible" && turno.alumno && turno.telefono) {
          lista.push({ key, di, h, alumno: turno.alumno, telefono: turno.telefono });
        }
        if (turno.estado === "grupal" && turno.alumnos) {
          turno.alumnos.forEach((al, idx) => {
            if (al.telefono) lista.push({ key: `${key}_${idx}`, di, h, alumno: al.nombre, telefono: al.telefono });
          });
        }
      });
    }
    return lista;
  }, [plantilla]);

  return (
    <div>
      <div className="flex items-start gap-3 bg-[#1B2620] border border-[#3A4A3F] rounded-2xl p-4 mb-4">
        <div className="w-9 h-9 rounded-full bg-[#D6A419]/15 flex items-center justify-center shrink-0 text-[#D6A419]"><IconBell /></div>
        <div>
          <h2 className="text-sm sm:text-base font-bold text-[#F3F0E8] mb-1">{aprobada ? "Semana publicada" : "Revisá la semana que viene"}</h2>
          <p className="text-xs sm:text-sm text-[#8FA090] leading-relaxed">
            {aprobada ? "Ya está visible para tus alumnos con esta disponibilidad." : `Generada a partir de tu plantilla: ${totalDisponibles} horarios disponibles. Revisala antes de publicarla.`}
          </p>
        </div>
      </div>

      <div className="overflow-x-auto -mx-3 px-3 pb-2">
        <div className="min-w-[560px] grid grid-cols-7 gap-1.5">
          {DIAS_LABEL.map((label, di) => (
            <div key={di} className="flex flex-col">
              <div className="text-center pb-1.5 mb-1.5 border-b-2 border-[#2E3D33]"><span className="text-[10px] sm:text-xs font-bold text-[#C7D6CA]">{label}</span></div>
              <div className="flex flex-col gap-1">
                {HORAS.map((h) => {
                  const turno = plantilla[`${di}_${h}`] || { estado: "disponible" };
                  const s = ESTILOS[turno.estado];
                  return <div key={h} className={`rounded-md text-[9px] sm:text-[10px] font-bold py-1.5 text-center ${s.bg} ${s.text}`}>{h}</div>;
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      {aprobada && todosParaAvisar.length > 0 && (
        <div className="mt-5">
          <p className="text-xs sm:text-sm font-bold text-[#F3F0E8] mb-2">Avisá a tus alumnos</p>
          <p className="text-[11px] sm:text-xs text-[#8FA090] mb-3">Tocá cada uno para abrir WhatsApp con el mensaje ya escrito.</p>
          <div className="flex flex-col gap-2">
            {todosParaAvisar.map(({ key, di, h, alumno, telefono }) => {
              const mensaje = `Hola ${alumno}! Te aviso que tu clase de pádel quedó cargada para el ${DIAS_NOMBRE[di]} a las ${h} hs. Confirmala acá: ${LINK_APP_ALUMNO}`;
              const yaAvisado = avisosEnviados.has(key);
              return (
                <div key={key} className="flex items-center justify-between gap-2 bg-[#1B2620] border border-[#3A4A3F] rounded-xl px-3.5 py-2.5">
                  <div><p className="text-sm font-semibold text-[#F3F0E8]">{alumno}</p><p className="text-[11px] text-[#8FA090] capitalize">{DIAS_NOMBRE[di]} · {h} hs</p></div>
                  {yaAvisado ? (
                    <span className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-[#232E27] text-[#5C6660] text-[11px] font-bold shrink-0"><IconCheck />Avisado</span>
                  ) : (
                    <a href={armarLinkWhatsapp(telefono, mensaje)} target="_blank" rel="noopener noreferrer" onClick={() => onAvisar(key)} className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-[#25D366] text-[#04210F] text-[11px] font-bold shrink-0 active:scale-95 transition"><IconWhatsapp />Avisar</a>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <button onClick={onAprobar} disabled={aprobada} className="mt-5 w-full py-3 rounded-xl bg-[#3F9142] text-[#EAFBEA] text-sm font-bold flex items-center justify-center gap-2 hover:brightness-95 active:scale-[0.98] transition disabled:opacity-50 disabled:pointer-events-none">
        <IconCheck />{aprobada ? "Semana aprobada" : "Aprobar y publicar semana"}
      </button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// CALENDARIO DEL ALUMNO
// ---------------------------------------------------------------------------
function CalendarioAlumno({ fb, telefono, onSalir }) {
  const [semanaPub, setSemanaPub] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [confirmando, setConfirmando] = useState(null);
  const [toast, setToast] = useState(null);
  const [diaFoco, setDiaFoco] = useState(0);

  useEffect(() => {
    const refPub = fb.doc(fb.db, "semanaPublicada", "actual");
    const unsub = fb.onSnapshot(refPub, (snap) => {
      setSemanaPub(snap.exists() ? snap.data() : null);
      setCargando(false);
    });
    return () => unsub();
  }, []);

  const mostrarToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  const confirmarClase = async (key) => {
    const refPub = fb.doc(fb.db, "semanaPublicada", "actual");
    const datos = { ...semanaPub.datos };
    const turno = { ...datos[key], confirmadoPorAlumno: true };
    datos[key] = turno;
    await fb.setDoc(refPub, { ...semanaPub, datos });
    setConfirmando(null);
    mostrarToast("Clase confirmada");
  };

  if (cargando) {
    return <div className="min-h-screen bg-[#141D18] flex items-center justify-center text-[#8FA090] text-sm">Cargando...</div>;
  }

  if (!semanaPub || !semanaPub.aprobada) {
    return (
      <div className="min-h-screen bg-[#141D18] text-[#EEEAE0] flex items-center justify-center px-5 text-center">
        <div>
          <p className="text-sm text-[#8FA090] mb-1">Todavía no hay una semana publicada.</p>
          <p className="text-xs text-[#5C6660]">Tu profe la va a cargar pronto.</p>
          <button onClick={onSalir} className="text-[10px] text-[#5C6660] underline mt-6">Salir</button>
        </div>
      </div>
    );
  }

  // Encontrar los turnos que le corresponden a este alumno
  const misTurnos = [];
  for (let di = 0; di < 7; di++) {
    HORAS.forEach((h) => {
      const key = `${di}_${h}`;
      const turno = semanaPub.datos[key];
      if (!turno) return;
      if (turno.estado === "no_disponible" && turno.telefono === telefono) {
        misTurnos.push({ key, di, h, tipo: "individual", confirmado: !!turno.confirmadoPorAlumno });
      }
      if (turno.estado === "grupal" && turno.alumnos) {
        turno.alumnos.forEach((al) => {
          if (al.telefono === telefono) misTurnos.push({ key, di, h, tipo: "grupal", confirmado: !!turno.confirmadoPorAlumno });
        });
      }
    });
  }

  const pendientes = misTurnos.filter((t) => !t.confirmado);
  const diaConPendiente = pendientes.length > 0 ? pendientes[0].di : null;

  return (
    <div className="min-h-screen bg-[#141D18] text-[#EEEAE0] font-sans relative overflow-hidden">
      <div className="pointer-events-none absolute inset-0 opacity-[0.04]" style={{ backgroundImage: "repeating-linear-gradient(0deg, transparent, transparent 78px, #F3F0E8 78px, #F3F0E8 80px), repeating-linear-gradient(90deg, transparent, transparent 78px, #F3F0E8 78px, #F3F0E8 80px)" }} />
      <div className="max-w-2xl mx-auto px-4 py-6 relative">
        <div className="flex items-center justify-between mb-4">
          <div>
            <p className="text-[10px] uppercase tracking-[0.2em] text-[#8FAE95] font-semibold">Tus clases</p>
            <h1 className="text-xl font-black text-[#F3F0E8]">Mis clases</h1>
          </div>
          <button onClick={onSalir} className="text-[10px] text-[#5C6660] underline">Salir</button>
        </div>

        <div className="h-px bg-gradient-to-r from-transparent via-[#8FAE95]/40 to-transparent mb-5" />

        {misTurnos.length === 0 ? (
          <p className="text-sm text-[#8FA090] text-center py-10">Todavía no tenés clases asignadas esta semana.</p>
        ) : (
          <div className="flex flex-col gap-3">
            {misTurnos.map((t) => (
              <div key={t.key} className={`rounded-2xl border p-4 ${t.confirmado ? "bg-[#1B2620] border-[#3A4A3F]" : "bg-[#D6A419]/10 border-[#D6A419]/40"}`}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className="text-sm font-bold text-[#F3F0E8] capitalize">{DIAS_NOMBRE[t.di]} · {t.h} hs</p>
                    <p className="text-xs text-[#8FA090]">{t.tipo === "grupal" ? "Clase grupal" : "Clase individual"}</p>
                  </div>
                  {t.confirmado ? (
                    <span className="flex items-center gap-1 text-[11px] font-semibold text-[#3F9142]"><IconCheck />Confirmada</span>
                  ) : (
                    <button onClick={() => setConfirmando(t)} className="px-3 py-1.5 rounded-lg bg-[#D6A419] text-[#241B04] text-[11px] font-bold active:scale-95 transition">Confirmar</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {confirmando && (
        <div className="fixed inset-0 bg-[#0A0F0C]/70 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 px-4" onClick={() => setConfirmando(null)}>
          <div className="bg-[#1B2620] border border-[#3A4A3F] rounded-2xl p-5 w-full sm:max-w-sm mb-4 sm:mb-0 shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <p className="text-[10px] uppercase tracking-[0.2em] text-[#D6A419] font-semibold mb-1">Confirmar clase</p>
            <h2 className="text-lg font-bold text-[#F3F0E8] mb-4 capitalize">{DIAS_NOMBRE[confirmando.di]}<span className="text-[#D6A419]"> · {confirmando.h} hs</span></h2>
            <div className="flex gap-2">
              <button onClick={() => setConfirmando(null)} className="flex-1 py-2.5 rounded-xl border border-[#3A4A3F] text-sm text-[#C7D6CA] hover:bg-[#232E27] transition">Volver</button>
              <button onClick={() => confirmarClase(confirmando.key)} className="flex-1 py-2.5 rounded-xl bg-[#3F9142] text-[#EAFBEA] text-sm font-bold hover:brightness-95 active:scale-[0.98] transition">Confirmar</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full text-sm font-medium shadow-lg z-50 border bg-[#3F9142] text-[#EAFBEA] border-[#3F9142]">{toast}</div>}
    </div>
  );
}

root.render(<AppRaiz />);
</script>
